name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npx next build
      - name: seo:validate (prerendered pages plus pages rendered per request, via next start)
        run: |
          npx next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/ > /dev/null && break; sleep 1; done
          SEO_BASE_URL=http://localhost:3100 npm run seo:validate
      - run: npm run zip:check
